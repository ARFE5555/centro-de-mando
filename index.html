<html lang="es">
<head>

<title>Centro de Mando UC</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabajo; en móvil la barra pasa arriba como cinta deslizable */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --sunk:#e9eef2; --ink:#14232e; --muted:#5b6b77; --line:#d8e0e6;
  --ceil:#3f7aa3; --ceil-soft:#e3eef6; --ceil-2:#9cc2de; --racks:#7b5ea7; --racks-soft:#efe9f7;
  --ok:#2f8a5b; --ok-soft:#e2f2e9; --warn:#a46b12; --warn-soft:#fbf0dc; --bad:#b4413a; --bad-soft:#f9e3e1;
  --side:#0f2a37; --side-ink:#d6e4ec; --side-muted:#86a2b2; --side-on:#1f4a5e;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#16222b; --sunk:#111b22; --ink:#e4ecf1; --muted:#93a4b0; --line:#273641;
  --ceil:#7fb3d8; --ceil-soft:#1c3243; --ceil-2:#3c6684; --racks:#b59ee0; --racks-soft:#2a2238;
  --ok:#5cc28d; --ok-soft:#173226; --warn:#e0a447; --warn-soft:#33270f; --bad:#ef8a83; --bad-soft:#3a1d1b;
  --side:#0a1218; --side-ink:#d6e4ec; --side-muted:#7f97a6; --side-on:#18303d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#16222b; --sunk:#111b22; --ink:#e4ecf1; --muted:#93a4b0; --line:#273641;
  --ceil:#7fb3d8; --ceil-soft:#1c3243; --ceil-2:#3c6684; --racks:#b59ee0; --racks-soft:#2a2238;
  --ok:#5cc28d; --ok-soft:#173226; --warn:#e0a447; --warn-soft:#33270f; --bad:#ef8a83; --bad-soft:#3a1d1b;
  --side:#0a1218; --side-ink:#d6e4ec; --side-muted:#7f97a6; --side-on:#18303d; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ceil)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--side);color:var(--side-ink);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font:700 18px/1.1 var(--f-display);display:grid;gap:4px;padding:0 8px}
.brand small{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.navlist{display:grid;gap:2px}
.navlist a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px}
.navlist a .n{font:500 11px var(--f-mono);color:var(--side-muted);width:18px;font-variant-numeric:tabular-nums}
.navlist a[aria-current="page"]{background:var(--side-on);color:#fff}
.navlist a:focus-visible{outline:2px solid var(--ceil-2);outline-offset:1px}
.sidefoot{margin-top:auto;display:grid;gap:6px;padding:0 8px;font-size:12px;color:var(--side-muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--side-muted);margin-right:6px}
.dot.on{background:#5cc28d}
main{min-width:0;padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;overflow-y:hidden;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand{white-space:nowrap;font-size:16px;padding:0}
  .brand small,.sidefoot{display:none}
  .navlist{display:flex;gap:4px}
  .navlist a{white-space:nowrap}
  .navlist a .n{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font:700 clamp(24px,3vw,32px)/1.1 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
h2{font:600 17px/1.25 var(--f-display);margin:0}
h3{font:600 14px/1.3 var(--f-display);margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
input[type=date],input[type=text],input[type=number],input[type=email],input[type=password],input[type=datetime-local],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ceil);outline-offset:1px}
.btn{border:1px solid var(--ceil);background:var(--ceil);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ceil)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{display:grid;gap:2px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.kpi .l{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 24px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.emp-u{color:var(--ceil)} .emp-r{color:var(--racks)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.03em;padding:4px 7px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--sunk);color:var(--muted)}
.p-u{background:var(--ceil-soft);color:var(--ceil)} .p-r{background:var(--racks-soft);color:var(--racks)}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);display:grid;gap:8px;justify-items:start}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;align-items:end}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form .wide{grid-column:1/-1}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px}
.alert b{font-family:var(--f-display)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:min(420px,calc(100vw - 32px));z-index:20}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bar-h{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--ceil)}
details summary{cursor:pointer}
.mono{font-family:var(--f-mono);font-size:13px}
.right{justify-self:end}
.login{max-width:440px}
.conn{display:grid;gap:8px}
.conn-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.panel,.kpi{transition:border-color .15s}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Módulos">
    <div class="brand">Centro de Mando<small>Uniformes Caracas · Racks</small></div>
    <div class="navlist" id="nav"></div>
    <div class="sidefoot" id="sidefoot"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- Cálculos compartidos con el bot (generado por scripts/build-web.mjs) ---------- */
window.UC = {};
Object.assign(window.UC, (() => {
// Calculadora de diferencial cambiario y fórmula de precios.
// Sin dependencias: se usa desde el bot, el sync y las pruebas.
//
// Convenciones:
//   usdt = Bs por USD a tasa de reposición (Binance P2P)
//   bcv  = Bs por USD a tasa oficial
// Cuando un cliente paga en Bs a tasa BCV, la tienda recibe menos dólares
// reales de los que necesita para reponer. El diferencial cubre esa brecha.

const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

function validarTasas(usdt, bcv) {
  if (!(usdt > 0) || !(bcv > 0)) throw new Error('Las tasas USDT y BCV deben ser mayores que cero');
}

function usdAVes(usd, tasa) {
  if (!(tasa > 0)) throw new Error('Tasa inválida');
  return r2(usd * tasa);
}

function vesAUsd(ves, tasa) {
  if (!(tasa > 0)) throw new Error('Tasa inválida');
  return r2(ves / tasa);
}

/** Brecha porcentual entre USDT y BCV (ej. 0.30 = 30 %). */
function brecha(usdt, bcv) {
  validarTasas(usdt, bcv);
  return usdt / bcv - 1;
}

/**
 * Diferencial a cobrar sobre una venta de `montoUsd` cuando se paga en Bs a BCV.
 * Devuelve cuánto hay que cobrar en Bs y cuánto representa el diferencial en USD-ref.
 */
function calcularDiferencial({ montoUsd, usdt, bcv }) {
  validarTasas(usdt, bcv);
  if (!(montoUsd >= 0)) throw new Error('Monto inválido');
  const bsACobrar = montoUsd * usdt;          // Bs necesarios para reponer los USD
  const refBcv = bsACobrar / bcv;             // lo que eso "parece" en dólares BCV
  const diferencialUsd = refBcv - montoUsd;   // lo que se agrega como línea #69
  return {
    montoUsd: r2(montoUsd),
    bsACobrar: r2(bsACobrar),
    refBcvUsd: r2(refBcv),
    diferencialUsd: r2(diferencialUsd),
    brechaPct: r2(brecha(usdt, bcv) * 100),
    bsSinDiferencial: r2(montoUsd * bcv),     // lo que se perdería cobrando a BCV puro
    perdidaSinDiferencialUsd: r2(montoUsd - (montoUsd * bcv) / usdt),
  };
}

/**
 * Diferencial efectivamente cobrado en una orden de Shopify:
 * compara la línea de diferencial con lo que debió cobrarse a las tasas del día.
 */
function auditarDiferencialOrden({ mercanciaUsd, diferencialCobradoUsd, usdt, bcv }) {
  const esperado = calcularDiferencial({ montoUsd: mercanciaUsd, usdt, bcv }).diferencialUsd;
  const desvio = r2(diferencialCobradoUsd - esperado);
  return {
    esperadoUsd: esperado,
    cobradoUsd: r2(diferencialCobradoUsd),
    desvioUsd: desvio,
    pctCobrado: mercanciaUsd > 0 ? r2((diferencialCobradoUsd / mercanciaUsd) * 100) : 0,
  };
}

const redondearArriba = (n, multiplo) => Math.ceil(n / multiplo - 1e-9) * multiplo;

/**
 * Fórmula de precio de la tienda:
 *   USD × USDT = Bs  →  Bs ÷ BCV = ref BCV  →  ÷(1−IVA)  →  ÷(1−Cashea)  →  redondeo al múltiplo
 * `redondearEn` decide si el múltiplo se aplica al precio en ref-USD ('ref') o en Bs ('bs').
 */
function formulaPrecio({ usd, usdt, bcv, ivaPct = 16, casheaPct = 5, multiplo = 5, redondearEn = 'ref' }) {
  validarTasas(usdt, bcv);
  const bs = usd * usdt;
  const ref = bs / bcv;
  const conIva = ref / (1 - ivaPct / 100);
  const conCashea = conIva / (1 - casheaPct / 100);
  const finalRef = redondearEn === 'ref' ? redondearArriba(conCashea, multiplo) : conCashea;
  const finalBs = redondearEn === 'bs'
    ? redondearArriba(conCashea * bcv, multiplo)
    : r2(finalRef * bcv);
  return {
    pasos: { bs: r2(bs), refBcv: r2(ref), conIva: r2(conIva), conCashea: r2(conCashea) },
    precioRefUsd: redondearEn === 'bs' ? r2(finalBs / bcv) : finalRef,
    precioBs: finalBs,
  };
}

return { usdAVes, vesAUsd, brecha, calcularDiferencial, auditarDiferencialOrden, formulaPrecio };
})());
Object.assign(window.UC, (() => {
// Calculadora de costos fijos y punto de equilibrio. Sin dependencias.

const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

const A_MENSUAL = { mensual: 1, quincenal: 2, semanal: 52 / 12, anual: 1 / 12 };

/**
 * @param {Array<{concepto:string, monto:number, moneda:'USD'|'VES', frecuencia?:string, activo?:boolean}>} costos
 * @param {{tasa:number, margenBrutoPct:number, diasOperativos?:number, ticketPromedioUsd?:number}} opts
 *   tasa: Bs por USD para convertir los costos en bolívares (normalmente USDT del día)
 *   margenBrutoPct: margen bruto de la mercancía (precio − costo) / precio, en %
 */
function calcularCostosFijos(costos, { tasa, margenBrutoPct, diasOperativos = 26, ticketPromedioUsd } = {}) {
  if (!(tasa > 0)) throw new Error('Se necesita la tasa para convertir los costos en Bs');
  if (!(margenBrutoPct > 0 && margenBrutoPct < 100)) throw new Error('El margen bruto debe estar entre 0 y 100');

  const detalle = costos
    .filter((c) => c.activo !== false)
    .map((c) => {
      const factor = A_MENSUAL[c.frecuencia ?? 'mensual'];
      if (factor === undefined) throw new Error(`Frecuencia desconocida: ${c.frecuencia}`);
      const mensualOriginal = c.monto * factor;
      const mensualUsd = c.moneda === 'VES' ? mensualOriginal / tasa : mensualOriginal;
      return { concepto: c.concepto, moneda: c.moneda, mensualOriginal: r2(mensualOriginal), mensualUsd: r2(mensualUsd) };
    })
    .sort((a, b) => b.mensualUsd - a.mensualUsd);

  const totalUsd = detalle.reduce((s, d) => s + d.mensualUsd, 0);
  const ventasEquilibrioUsd = totalUsd / (margenBrutoPct / 100);

  return {
    detalle: detalle.map((d) => ({ ...d, pesoPct: totalUsd ? r2((d.mensualUsd / totalUsd) * 100) : 0 })),
    totalMensualUsd: r2(totalUsd),
    totalMensualVes: r2(totalUsd * tasa),
    costoDiarioUsd: r2(totalUsd / diasOperativos),
    ventasEquilibrioMesUsd: r2(ventasEquilibrioUsd),
    ventasEquilibrioDiaUsd: r2(ventasEquilibrioUsd / diasOperativos),
    ordenesEquilibrioDia: ticketPromedioUsd ? Math.ceil(ventasEquilibrioUsd / diasOperativos / ticketPromedioUsd) : null,
  };
}

return { calcularCostosFijos };
})());
Object.assign(window.UC, (() => {
// Comisión GRUPAL y nómina. Sin dependencias.
//
// La tienda genera un pozo = % sobre las ventas de mercancía del período
// (el diferencial cambiario no cuenta). El pozo se reparte entre el equipo:
//   • "iguales": partes iguales entre quienes participan (ajustable con un peso por persona)
//   • "dias":    proporcional a los días trabajados (tabla turnos) × peso
// No hace falta saber qué vendedora hizo cada venta.

const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

/**
 * @param {{ventasUsd:number, pct:number, reparto?:'iguales'|'dias',
 *          empleados:Array<{cedula:string, nombre?:string, apellido?:string, activo?:boolean,
 *                           participa_comision?:boolean, peso_comision?:number}>,
 *          turnos?:Array<{fecha:string, cedula:string}>}} p
 */
function comisionGrupal({ ventasUsd, pct, reparto = 'iguales', empleados, turnos = [] }) {
  const pozo = r2(Math.max(0, Number(ventasUsd) || 0) * (Number(pct) || 0) / 100);
  const participantes = empleados.filter((e) => e.activo !== false && e.participa_comision !== false);

  const dias = {};
  for (const t of turnos) {
    const c = String(t.cedula);
    dias[c] = dias[c] ?? new Set();
    dias[c].add(String(t.fecha).slice(0, 10));
  }

  const usarDias = reparto === 'dias';
  const puntos = participantes.map((e) => {
    const peso = Number(e.peso_comision ?? 1);
    const d = dias[e.cedula]?.size ?? 0;
    return { e, peso, dias: d, puntos: usarDias ? peso * d : peso };
  });
  const total = puntos.reduce((s, p) => s + p.puntos, 0);

  // Reparto en centavos para que la suma cuadre exacto con el pozo.
  const centavos = Math.round(pozo * 100);
  const lineas = puntos.map((p) => {
    const exacto = total > 0 ? (centavos * p.puntos) / total : 0;
    return { cedula: p.e.cedula, nombre: `${p.e.nombre ?? ''} ${p.e.apellido ?? ''}`.trim(), peso: p.peso, dias: p.dias, base: Math.floor(exacto), resto: exacto - Math.floor(exacto) };
  });
  let sobrante = total > 0 ? centavos - lineas.reduce((s, l) => s + l.base, 0) : 0;
  [...lineas].sort((a, b) => b.resto - a.resto).forEach((l) => { if (sobrante > 0) { l.base += 1; sobrante -= 1; } });

  const repartido = lineas.map(({ base, resto, ...l }) => ({
    ...l,
    participacion_pct: total > 0 ? r2((puntos.find((p) => p.e.cedula === l.cedula).puntos / total) * 100) : 0,
    comision_usd: base / 100,
  }));

  const avisos = [];
  if (!(Number(pct) > 0)) avisos.push('El % de comisión grupal está en 0: configúralo con "comision 2" (por ejemplo).');
  if (usarDias && total === 0 && participantes.length) avisos.push('Reparto por días, pero no hay turnos cargados en el período: nadie recibe comisión.');
  if (!participantes.length) avisos.push('No hay empleados activos que participen de la comisión.');

  return { ventas_usd: r2(ventasUsd), pct: Number(pct) || 0, reparto, pozo_usd: pozo, lineas: repartido, avisos };
}

/**
 * Nómina mixta del período. El salario guardado en `empleados` es POR PAGO.
 * @param {Array} empleados
 * @param {Record<string, number>} comisiones  cédula → comisión USD
 * @param {{tasaPago?:number}} opts  Bs por USD, para expresar totales en Bs
 */
function calcularNomina(empleados, comisiones = {}, { tasaPago } = {}) {
  const lineas = empleados.filter((e) => e.activo !== false).map((e) => {
    const baseUsd = Number(e.salario_usd ?? 0);
    const baseVes = Number(e.salario_ves ?? 0);
    const comisionUsd = r2(Number(comisiones[e.cedula] ?? 0));
    const baseVesEnUsd = tasaPago > 0 ? baseVes / tasaPago : 0;
    const totalUsd = r2(baseUsd + comisionUsd + baseVesEnUsd);
    return {
      cedula: e.cedula,
      nombre: `${e.nombre} ${e.apellido}`.trim(),

  const tAhora = ahora.getTime();
  const desdeLarga = tAhora - ventanaLarga * DIA;
  const desdeCorta = tAhora - ventanaCorta * DIA;

  const porProducto = new Map();
  for (const l of lineas) {
    if (l.es_mercancia === false || l.cancelada) continue;
    if (excluir.has(String(l.producto_id))) continue;
    if (/DIFERENCIAL\s+CAMBIARIO/i.test(l.titulo ?? '')) continue;
    const t = new Date(l.fecha).getTime();
    if (Number.isNaN(t) || t < desdeLarga || t > tAhora) continue;
    const qty = Number(l.cantidad_real ?? 0);
    if (qty <= 0) continue;

    let p = porProducto.get(l.producto_id);
    if (!p) {
      p = { producto_id: l.producto_id, titulo: l.titulo, uLarga: 0, uCorta: 0, usdLarga: 0, usdCorta: 0, ordenes: new Set() };

    const usd = Number(l.total_usd ?? 0);

    p.usdLarga += usd;

    .filter((p) => p.ordenes.size >= minOrdenes)

        titulo: p.titulo,
        unidades: p.uLarga,

const norm = (s) => String(s ?? '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function monedaDe(cur) {
  const c = norm(cur);
  if (c === 'ves' || c === 'bs' || c === 'bsd' || c === 'vef') return 'VES';

function buscadorDeTasas(tasas, campo = 'usdt') {
  const lista = tasas.map((t) => ({ fecha: String(t.fecha), v: Number(t[campo]) }))
    .filter((t) => t.v > 0).sort((a, b) => a.fecha.localeCompare(b.fecha));
  return (fecha) => {
    let res = null;
    for (const t of lista) { if (t.fecha <= fecha) res = t.v; else break; }
    return res;
  };
}

/**
 * Lee "uniformes=Uniformes Caracas,Uniformes|racks=Racks" → [{empresa, patrones[]}]
 */
function parsearEmpresas(texto = '') {
  return String(texto).split('|').map((bloque) => {
    const [empresa, lista = ''] = bloque.split('=');
    return { empresa: norm(empresa), patrones: lista.split(',').map(norm).filter(Boolean) };
  }).filter((e) => e.empresa && e.patrones.length);

 * 2. Por cuenta: la cuenta está asignada a una empresa (para transacciones sin proyecto).

 */
function clasificadorPatrimonio({ empresas = [], cuentas = [] } = {}) {
  return (txn, cuenta) => {
    const proy = norm(txn.project);
    if (proy) {
      for (const e of empresas) if (e.patrones.some((p) => proy === p || proy.includes(p))) return e.empresa;
    }
    const nom = norm(cuenta?.name);
    if (nom) {
      for (const e of cuentas) if (e.patrones.includes(nom)) return e.empresa;

};
const errDemo = () => Object.assign(new Error('Es una demostración: no se guarda nada.'), { demo: true });
const toastErr = (e) => toast(e.demo ? e.message : 'No se pudo guardar: ' + e.message);
async function guardar(tabla, fila, { onConflict } = {}) {
  if (DEMO) throw errDemo();
  const q = onConflict ? cliente('centro').from(tabla).upsert(fila, { onConflict }) : cliente('centro').from(tabla).upsert(fila);

  if (error) throw new Error(error.message);
  CACHE.clear(); return data;
}
async function borrar(tabla, campo, valor) {
  if (DEMO) throw errDemo();

/* Tasa para convertir Bs: la del centro (USDT) o, si no hay, la tasa anotada en el cierre de caja. */
async function tasaPara() {
  const t = await D.tasas();
  if (t && t.length) return UC.buscadorDeTasas(t, 'usdt');
  const c = await D.cierres();
  return UC.buscadorDeTasas((c || []).filter((x) => x.tasa).map((x) => ({ fecha: x.fecha, usdt: x.tasa })), 'usdt');
}
async function tasaHoy() {
  const t = await D.tasas();
  if (t && t.length) return t[t.length - 1];
  const c = (await D.cierres()) || [];
  const ult = c.find((x) => x.tasa);
  return ult ? { fecha: ult.fecha, usdt: ult.tasa, bcv: null, deCierre: true } : null;
}

const F = { periodo: 'mes', desde: null, hasta: null, empresa: 'todas' };
try { Object.assign(F, JSON.parse(localStorage.getItem('uc-filtros') || '{}')); } catch {}
function rango() {
  const h = hoy();
  if (F.periodo === 'hoy') return { desde: h, hasta: h };
  if (F.periodo === '7d') return { desde: sumaDias(h, -6), hasta: h };
  if (F.periodo === 'mespasado') {
    const [y, m] = h.split('-').map(Number); const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
    const ult = new Date(Date.UTC(py, pm, 0)).getUTCDate(); const p = (n) => String(n).padStart(2, '0');
    return { desde: `${py}-${p(pm)}-01`, hasta: `${py}-${p(pm)}-${p(ult)}` };
  }
  if (F.periodo === 'otro' && F.desde && F.hasta) return { desde: F.desde, hasta: F.hasta };
  return { desde: h.slice(0, 8) + '01', hasta: h };
}

const kpi = (l, v, s = '', cls = '') => `<div class="kpi"><span class="l">${l}</span><span class="v ${cls}">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
function vacio(fuente, extra = '') {
  return `<div class="empty"><strong>${esc(FUENTES[fuente].nombre)} sin conectar.</strong><span>${esc(FUENTES[fuente].desc)}</span>${extra}<a class="btn small" href="#conexiones">Conectar</a></div>`;
}
function barras(datos, { alto = 260, series, etiqueta }) {
  // datos: [{x, ...valores}], series: [{k, color, nombre}] apiladas
  if (!datos.length) return '<p class="muted small">Sin datos en el período.</p>';
  const W = 760, H = alto, L = 52, B = 26, T = 10, R = 8;
  const tot = datos.map((d) => series.reduce((s, se) => s + Math.max(0, d[se.k] || 0), 0));
  const max = Math.max(1, ...tot);
  const paso = Math.pow(10, Math.floor(Math.log10(max))); const tope = Math.ceil(max / paso) * paso;
  const ticks = [0, tope / 2, tope];
  const bw = (W - L - R) / datos.length;
  const y = (v) => T + (H - T - B) * (1 - v / tope);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(etiqueta)}">`;
  for (const t of ticks) svg += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--f-mono)">${usd0(t)}</text>`;
  datos.forEach((d, i) => {
    let acc = 0;
    for (const se of series) {
      const v = Math.max(0, d[se.k] || 0); if (!v) continue;
      svg += `<rect x="${L + i * bw + bw * 0.15}" width="${bw * 0.7}" y="${y(acc + v)}" height="${y(acc) - y(acc + v)}" fill="${se.color}" rx="1.5"><title>${esc(d.x)} · ${se.nombre}: ${usd(v)}</title></rect>`;
      acc += v;
    }
    const cada = Math.ceil(datos.length / 10);
    if (i % cada === 0 || i === datos.length - 1) svg += `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--f-mono)">${esc(fCorta(d.x))}</text>`;
  });
  return `<div class="chart">${svg}</svg></div><div class="legend">${series.map((s) => `<span><i class="sw" style="background:${s.color}"></i>${s.nombre}</span>`).join('')}</div>`;
}
function diasDel(r) { const out = []; for (let f = r.desde; f <= r.hasta; f = sumaDias(f, 1)) out.push(f); return out; }

/* Ventas de Uniformes en el rango: Shopify si el centro está conectado; si no, lo que registran los cierres de caja. */
async function ventasUniformes(r) {
  const v = await D.ventasDiarias();
  if (v) {
    const m = Object.fromEntries(v.map((d) => [d.dia, d]));
    const dias = diasDel(r).map((x) => ({ x, mercancia: Number(m[x]?.mercancia_usd || 0), diferencial: Number(m[x]?.diferencial_usd || 0), ordenes: Number(m[x]?.ordenes || 0) }));
    return { fuente: 'Shopify', dias, separa: true };
  }
  const c = await D.cierres();
  if (c) {
    const m = Object.fromEntries(c.map((d) => [d.fecha, d]));
    const dias = diasDel(r).map((x) => ({ x, mercancia: Number(m[x]?.ventas_usd || 0), diferencial: 0, ordenes: Number(m[x]?.pedidos || 0) }));
    return { fuente: 'cierres de caja (solo POS)', dias, separa: false };
  }
  return null;
}

/* Todos los movimientos del período, de las tres fuentes, sin duplicar. */
async function movimientos(r) {
  const [pat, cen, cie] = await Promise.all([D.patrimonio(), D.movCentro(), D.cierres()]);
  const salidas = (cie || []).flatMap((c) => c.egresos.map((e) => ({ ...e, cuenta: 'Caja tienda', monto_usd: e.monto, fuente: 'Cierre de caja' })));
  const todos = [...(pat || []), ...(cen || []), ...salidas];
  return { lista: todos.filter((m) => enRango(m.fecha, r)), fuentes: { patrimonio: !!pat, centro: !!cen, cierre: !!cie } };
}

/* Estado de resultados por empresa, sin doble conteo. */
async function resultados(r) {
  const [vu, { lista }] = await Promise.all([ventasUniformes(r), movimientos(r)]);
  const base = () => ({ ventas: 0, diferencial: 0, otros: 0, cobros: 0, gastos: 0, gastosBs: 0, sinTasa: 0, porCat: {} });
  const E = { uniformes: base(), racks: base() };
  if (vu) for (const d of vu.dias) { E.uniformes.ventas += d.mercancia; E.uniformes.diferencial += d.diferencial; }
  for (const m of lista) {
    const e = E[m.empresa]; if (!e) continue;
    if (m.tipo === 'ingreso') {
      if (m.empresa === 'uniformes' && m.fuente === 'Patrimonio') e.cobros += m.monto_usd || 0; else e.otros += m.monto_usd || 0;
    } else if (m.tipo === 'gasto') {
      if (m.monto_usd == null) e.sinTasa++; else e.gastos += m.monto_usd;
      if (m.moneda === 'VES') e.gastosBs += m.monto;
      const k = m.categoria || (m.fuente === 'Cierre de caja' ? 'Salidas de caja' : 'Sin categoría');
      e.porCat[k] = (e.porCat[k] || 0) + (m.monto_usd || 0);
    }
  }
  for (const e of Object.values(E)) { e.ingresos = e.ventas + e.diferencial + e.otros; e.resultado = e.ingresos - e.gastos; }
  return { E, vu };
}

function costosPedido(p, items) {
  const mercancia = items.length ? items.reduce((s, i) => s + Number(i.cantidad || 0) * Number(i.costo_unit || 0), 0) : Number(p.total || 0);

  const recibidas = items.reduce((s, i) => s + Math.min(Number(i.recibido || 0), Number(i.cantidad || 0)), 0);
  const extra = Number(p.flete_usd || 0) + Number(p.nacionalizacion_usd || 0);
  return { mercancia: r2(mercancia), unidades, recibidas, extra: r2(extra), total: r2(mercancia + extra), factor: mercancia > 0 ? (mercancia + extra) / mercancia : 1 };
}
function bloqueItems(p, items) {

    </form>

      <label>Flete USD<input type="number" min="0" step="0.01" value="${Number(p.flete_usd || 0)}"></label>
      <label>Nacionalización USD<input type="number" min="0" step="0.01" value="${Number(p.nacionalizacion_usd || 0)}"></label>
      <button class="btn ghost small" type="submit">Guardar costos</button>
    </form>
  </div>`;
}

function calcDif() {
  const m = Number($('#d-monto')?.value), u = Number($('#d-usdt')?.value), b = Number($('#d-bcv')?.value);
  const out = $('#d-out'), pf = $('#pf-out'); if (!out) return;
  if (!(u > 0 && b > 0)) { out.innerHTML = '<p class="muted">Escribe las dos tasas.</p>'; if (pf) pf.innerHTML = ''; return; }
  const d = UC.calcularDiferencial({ montoUsd: m || 0, usdt: u, bcv: b });
  out.innerHTML = `<div class="kpis">${kpi('Cobrar en Bs', bs(d.bsACobrar))}${kpi('Línea #69', usd(d.diferencialUsd), `brecha ${nf(1).format(d.brechaPct)}%`)}${kpi('Ref. BCV', usd(d.refBcvUsd))}</div><p class="small">Si se cobra a BCV sin diferencial se pierden <strong>${usd(d.perdidaSinDiferencialUsd)}</strong> en esta venta.</p>`;
  const cfg = CACHE.get('config');
  Promise.resolve(cfg).then((c = {}) => {
    const p = UC.formulaPrecio({ usd: Number($('#pf-usd').value) || 0, usdt: u, bcv: b, ivaPct: Number(c.iva_pct ?? 16), casheaPct: Number(c.cashea_pct ?? 5), multiplo: Number(c.redondeo_bs ?? 5) });
    pf.innerHTML = `<div class="tbl-wrap"><table><tbody><tr><td>En Bs a USDT</td><td class="num">${bs(p.pasos.bs)}</td></tr><tr><td>Ref. BCV</td><td class="num">${usd(p.pasos.refBcv)}</td></tr><tr><td>Con IVA</td><td class="num">${usd(p.pasos.conIva)}</td></tr><tr><td>Con Cashea</td><td class="num">${usd(p.pasos.conCashea)}</td></tr><tr><td><strong>Precio de lista</strong></td><td class="num"><strong>${usd(p.precioRefUsd)}</strong></td></tr><tr><td>En Bs (BCV)</td><td class="num">${bs(p.precioBs)}</td></tr></tbody></table></div>`;
  });
}
document.addEventListener('input', (ev) => { if (['d-monto', 'd-usdt', 'd-bcv', 'pf-usd'].includes(ev.target.id)) calcDif(); });

function linkCalendar(x) {
  const ini = new Date(x.cuando), fin = new Date(ini.getTime() + 30 * 60000);
  const f = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const rec = x.repetir ? '&recur=' + encodeURIComponent('RRULE:FREQ=' + ({ diario: 'DAILY', semanal: 'WEEKLY', mensual: 'MONTHLY' })[x.repetir]) : '';
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(x.texto)}&dates=${f(ini)}/${f(fin)}&ctz=America/Caracas&details=${encodeURIComponent('Centro de mando · ' + (EMP[x.empresa] || 'Uniformes Caracas / Racks'))}${rec}`;
}

document.addEventListener('submit', async (ev) => {
  const f = ev.target;
  if (f.id === 'f-gasto') return enviarGasto(ev);
  if (f.id === 'f-pedido') return enviarPedido(ev);
  ev.preventDefault();
  try {
    if (f.id === 'f-login') {
      $('#l-res').textContent = 'Entrando…';
      const res = await entrar($('#l-mail').value.trim(), $('#l-clave').value, $('#l-solo').value || null);
      CACHE.clear(); render();
      setTimeout(() => { const el = $('#l-res'); if (el) el.innerHTML = Object.entries(res).map(([k, v]) => `${FUENTES[k].nombre}: ${v === 'ok' ? '<span class="pill p-ok">conectado</span>' : `<span class="pill p-bad">${esc(v)}</span>`}`).join('<br>'); }, 50);
      return;
    }
    if (f.dataset.envio) {
      const [sel, inp] = f.querySelectorAll('select,input');
      await guardar('envios', { pedido_id: f.dataset.envio, transportista: sel.value, tracking: inp.value.trim() });
      toast('Guía agregada.');
    } else if (f.dataset.factura) {
      const [num, monto, file] = f.querySelectorAll('input');
      let ruta = null;
      if (file.files[0] && !DEMO) {
        const fl = file.files[0]; ruta = `${f.dataset.factura}/${Date.now()}-${fl.name.replace(/[^\w.-]+/g, '_')}`;
        const { error } = await cliente('centro').storage.from('facturas').upload(ruta, fl, { upsert: false });
        if (error) throw new Error(error.message);
      }
      await guardar('facturas', { pedido_id: f.dataset.factura, numero: num.value.trim() || null, monto: Number(monto.value) || null, archivo_url: ruta, fecha: hoy() });
      toast('Factura guardada.');
    } else if (f.dataset.item) {
      const [sku, desc, cant, costo] = f.querySelectorAll('input');
      await guardar('pedido_items', { pedido_id: f.dataset.item, sku: sku.value.trim() || null, descripcion: desc.value.trim() || null, cantidad: Number(cant.value), costo_unit: Number(costo.value), recibido: 0 });
      toast('Artículo añadido.');
    } else if (f.dataset.costos) {
      const [fl, na] = f.querySelectorAll('input');
      await guardar('pedidos', { id: f.dataset.costos, flete_usd: Number(fl.value) || 0, nacionalizacion_usd: Number(na.value) || 0 });
      toast('Costos del pedido guardados.');
    } else if (f.id === 'f-costo') {
      await guardar('costos_fijos', { concepto: $('#c-conc').value.trim(), monto: Number($('#c-monto').value), moneda: $('#c-mon').value, frecuencia: $('#c-frec').value, dia_pago: Number($('#c-dia').value) || null, empresa: F.empresa === 'racks' ? 'racks' : 'uniformes' });
      toast('Costo agregado.');
    } else if (f.id === 'f-com') {
      await guardar('config', { clave: 'comision_grupal', valor: { pct: Number($('#com-pct').value) || 0, reparto: $('#com-rep').value } });
      toast('Comisión actualizada.');
    } else if (f.id === 'f-emp') {
      await guardar('empleados', { cedula: $('#e-ced').value.trim(), nombre: $('#e-nom').value.trim(), apellido: $('#e-ape').value.trim(), cargo: $('#e-car').value.trim() || null, salario_usd: Number($('#e-usd').value) || 0, salario_ves: Number($('#e-ves').value) || 0, frecuencia_pago: $('#e-frec').value, peso_comision: Number($('#e-peso').value) || 1, empresa: 'uniformes', activo: true }, { onConflict: 'cedula' });
      toast('Empleado guardado.');
    } else if (f.id === 'f-rec') {
      const cuando = new Date($('#r-cuando').value + ':00-04:00');
      await guardar('recordatorios', { texto: $('#r-txt').value.trim(), cuando: cuando.toISOString(), repetir: $('#r-rep').value || null, destino: $('#r-tel').value.replace(/\D/g, ''), empresa: $('#r-emp').value || null, creado_por: S.yo?.nombre || 'web' });
      toast('Recordatorio programado. Llegará por WhatsApp.');
    } else return;
    render();
  } catch (e) { toastErr(e); }
});

  try {
    if (t.id === 'b-salir') return salir();
    if (t.dataset.borraCosto) { await borrar('costos_fijos', 'id', Number(t.dataset.borraCosto)); toast('Costo quitado.'); return render(); }
    if (t.dataset.borraItem) { await borrar('pedido_items', 'id', Number(t.dataset.borraItem)); toast('Artículo quitado.'); return render(); }
    if (t.dataset.borraRec) { await borrar('recordatorios', 'id', t.dataset.borraRec); toast('Recordatorio quitado.'); return render(); }
    if (t.dataset.ver) {
      if (DEMO) return toast('Modo demo: no hay archivo.');
      const { data, error } = await cliente('centro').storage.from('facturas').createSignedUrl(t.dataset.ver, 300);
      if (error) throw new Error(error.message);
      const a = document.createElement('a'); a.href = data.signedUrl; a.target = '_blank'; a.rel = 'noopener'; a.click();
    }
    if (t.id === 'b-guardar-nom' && S.ultimaNomina) {
      const { r, com, nom, tasa } = S.ultimaNomina;
      const [p] = await guardar('nomina_periodos', { desde: r.desde, hasta: r.hasta, estado: 'calculado' }, { onConflict: 'desde,hasta' });
      await guardar('nomina_lineas', nom.lineas.map((l) => ({ periodo_id: p.id, cedula: l.cedula, base_usd: l.base_usd, base_ves: l.base_ves, ventas_usd: com.ventas_usd, comision_usd: l.comision_usd, tasa_pago: tasa, total_usd: l.total_usd })), { onConflict: 'periodo_id,cedula' });
      toast(`Nómina del ${fCorta(r.desde)} al ${fCorta(r.hasta)} guardada.`);
    }
  } catch (e) { toastErr(e); }
});

/* =====================================================================
   ARRANQUE Y RUTAS
   ===================================================================== */
const VER_ROL = {
  vendedora: ['resumen', 'ventas', 'calientes', 'diferencial', 'nomina', 'agenda', 'conexiones'],
  encargada: ['resumen', 'ventas', 'pedidos', 'calientes', 'diferencial', 'agenda', 'cierre', 'conexiones'],
  admin: VISTAS.map((v) => v[0]).filter((v) => v !== 'nomina'),
  dueno: VISTAS.map((v) => v[0]),
};
function pintarNav(actual) {
  const vis = VER_ROL[S.rol] || VER_ROL.dueno;
  $('#nav').innerHTML = VISTAS.filter(([k]) => vis.includes(k)).map(([k, l, n]) => `<a href="#${k}" ${k === actual ? 'aria-current="page"' : ''}><span class="n">${n}</span>${l}</a>`).join('');
  $('#sidefoot').innerHTML = DEMO ? '<span>Modo demo</span>' : Object.entries(FUENTES).map(([k, f]) => `<span><i class="dot ${S.sesion[k] ? 'on' : ''}"></i>${f.nombre}</span>`).join('');
}
let pintando = 0;
async function render() {
  const id = (location.hash || '#resumen').slice(1);
  const vista = V[id] ? id : 'resumen';
  pintarNav(vista);
  const yo = ++pintando;
  const main = $('#main');
  try {
    const html = await V[vista]();
    if (yo !== pintando) return;
    main.innerHTML = (DEMO ? `<div class="banner"><strong>Vista de demostración.</strong> ${esc(DEMO.nota)}</div>` : '') + html;
    if (vista === 'diferencial') calcDif();
  } catch (e) {
    if (yo !== pintando) return;
    main.innerHTML = `<div class="banner">No se pudo cargar esta sección: ${esc(e.message)}. Revisa la conexión en <a href="#conexiones">Conexiones</a>.</div>`;
  }
}
window.addEventListener('hashchange', () => { render(); $('#main').focus({ preventScroll: true }); });
(async () => {
  if (DEMO) F.periodo = F.periodo || 'mes';
  await revisarSesiones();
  if (!DEMO && !Object.values(S.sesion).some(Boolean) && !location.hash) location.hash = '#conexiones';
  render();
})();
</script>
</body>
